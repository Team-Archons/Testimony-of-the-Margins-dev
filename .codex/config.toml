
[mcp_servers.unity]
command = "C:\\Users\\user\\AppData\\Local\\Microsoft\\WindowsApps\\unity.exe"
args = ["mcp"]

[sandbox_workspace_write]
network_access = true

[features.network_proxy]
enabled = true
allow_local_binding = false

[features.network_proxy.domains]
localhost = "allow"
"127.0.0.1" = "allow"
"::1" = "allow"
